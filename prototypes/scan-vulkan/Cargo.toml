[package]
name = "scan-vulkan"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the wallet: can a GPU find 8aR faster than the phone's cores?
[workspace]

[dependencies]
ash = { version = "0.38", features = ["loaded"] }
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
sha3 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

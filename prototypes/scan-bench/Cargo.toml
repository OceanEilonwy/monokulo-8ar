[package]
name = "scan-bench"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the wallet: compares ways of scanning on one fixed set of blocks.
[workspace]

[dependencies]
fob-core = { path = "../../crates/fob-core" }
monero-wallet = "0.2"
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
sha3 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zeroize = "1"
hex = "0.4"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[patch.crates-io]
monero-wallet = { path = "../monero-wallet-patched" }
